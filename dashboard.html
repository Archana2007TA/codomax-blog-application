<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogApp - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">BlogSpace</a>
        <ul class="nav-links" id="nav-links"></ul>
    </nav>

    <main class="container">
        <h2 id="user-welcome">User Dashboard</h2>
        <p style="margin-bottom: 1.5rem; color: var(--text-muted);">Manage your published blog articles here.</p>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Date Published</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="dashboard-blog-list"></tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 BlogSpace App. Built for Codomax Internship.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
